kind = "web"
previewPath = "/"
title = "TJKT Website"
description = "A polished, responsive showcase website for the Teknik Jaringan Komputer dan Telekomunikasi program, preserving the original visual assets while delivering refined motion and Vercel-ready production output."
version = "1.0.0"
id = "artifacts/tjkt-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19183

[services.development]
run = "pnpm --filter @workspace/tjkt-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tjkt-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/tjkt-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19183"
BASE_PATH = "/"
